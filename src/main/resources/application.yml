server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rule-engine-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rules}
    username: ${DB_USER:rules}
    password: ${DB_PASSWORD:rules}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

logging:
  level:
    org.drools.ruleserver: INFO
    org.drools: WARN
    org.kie: WARN
